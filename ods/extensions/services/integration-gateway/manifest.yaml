schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: integration-gateway
  name: Integration Gateway
  aliases: [integration-gateway]
  container_name: ods-integration-gateway
  default_host: integration-gateway
  port: 8092
  external_port_default: 0
  health: /health
  ui_path: /health
  external_link: false
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: >
    Internal-only governed integration boundary with a read-only Plane adapter.
    Platform event delivery, webhook ingestion, and external writes are disabled.
  env_vars:
    - key: ODS_PLANE_BASE_URL
      default: ""
      description: Verified HTTPS Plane URL; plain HTTP is rejected unless explicitly opted into.
    - key: ODS_PLANE_WORKSPACE_SLUG
      default: ""
      description: Plane workspace slug used by the read-only project probe.
    - key: ODS_PLANE_ALLOW_INSECURE_HTTP
      default: "false"
      description: Set true only for a trusted private network where the Plane API is intentionally served over HTTP.
    - key: ODS_PLANE_API_KEY_HOST_FILE
      default: ./extensions/services/integration-gateway/config/plane_api_key.empty
      description: Host path to the Plane API key secret file, mounted read-only into the service.

features:
  - id: governed-integrations
    name: Governed Integrations
    description: Platform inventory, field ownership, readiness, event validation, and read-only Plane probes
    icon: Waypoints
    category: productivity
    requirements:
      services: [integration-gateway]
    enabled_services_all: [integration-gateway]
    setup_time: Operator configuration required
    priority: 5
    launch:
      type: service
      service: integration-gateway
    gpu_backends: [all]
