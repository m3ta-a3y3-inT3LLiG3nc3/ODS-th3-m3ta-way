schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: m3ta-integration-gateway
  name: M3ta Integration Gateway
  aliases: [m3ta-gateway, integration-gateway, qb-gateway]
  container_name: ods-m3ta-integration-gateway
  default_host: m3ta-integration-gateway
  port: 8094
  external_port_env: M3TA_INTEGRATION_GATEWAY_PORT
  external_port_default: 8094
  health: /health
  ui_path: /docs
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: >
    Governed integration boundary between QB, Hermes, Plane, Open Notebook,
    Nimbalyst, Colanode, HyNote, and Raycast. Normalizes platform identity,
    ownership, events, readiness, and adapter policy without creating a
    second source of truth.

features:
  - id: m3ta-platform-mesh
    name: M3ta Platform Mesh
    description: Governed interoperability for MetaHuman OS platform surfaces
    icon: Network
    category: agents
    requirements:
      services: []
    enabled_services_any: [m3ta-integration-gateway]
    setup_time: Configure
    priority: 20
    launch:
      type: web
      path: /docs
    gpu_backends: [all]
